x-node-env: &node-env
  RUST_LOG: info
  DEFRA_KEYRING_SECRET: test-secret
  BROKER_HOST: 0.0.0.0
  BROKER_PORT: 8080
  BROKER_DEFRADB_TIMEOUT_MS: 120000
  BROKER_OUTBOUND_TIMEOUT_MS: 5000
  BROKER_P2P_ENABLED: "true"
  BROKER_PEER_SYNC_TIMEOUT_MS: 120000
  BROKER_P2P_SEEDS: http://node1:8080/ngsi-ld/v1,http://node2:8080/ngsi-ld/v1,http://node3:8080/ngsi-ld/v1,http://node4:8080/ngsi-ld/v1,http://node5:8080/ngsi-ld/v1,http://node6:8080/ngsi-ld/v1,http://node7:8080/ngsi-ld/v1,http://node8:8080/ngsi-ld/v1,http://node9:8080/ngsi-ld/v1,http://node10:8080/ngsi-ld/v1
  BROKER_ENTITY_EVENT_WATCH_ENABLED: "true"
  BROKER_ENTITY_EVENT_WATCH_INTERVAL_MS: 100
  BROKER_ENTITY_WATCH_ENABLED: "true"
  BROKER_ENTITY_WATCH_INTERVAL_MS: 30000

x-node-service: &node-service
  build:
    context: .
    dockerfile: ${SWARM_DOCKERFILE:-docker/Dockerfile}
  image: ${SWARM_NODE_IMAGE:-leona-swarm-node:latest}
  environment: *node-env
  depends_on:
    - sink
  networks:
    - swarm

services:
  sink:
    image: python:3.12-alpine
    command: ["python", "/app/notification_sink.py", "8080"]
    volumes:
      - ./tests/notification_sink.py:/app/notification_sink.py:ro
    ports:
      - "19080:8080"
    networks:
      - swarm

  node1:
    <<: *node-service
    environment:
      <<: *node-env
      BROKER_ID: node1
      BROKER_PUBLIC_ENDPOINT: http://node1:8080/ngsi-ld/v1
      BROKER_DEFRADB_URL: http://127.0.0.1:9181/api/v0/graphql
    volumes:
      - node1-data:/data
    ports:
      - "18081:8080"
      - "19181:9181"

