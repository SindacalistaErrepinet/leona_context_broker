version: "3.8"

x-defradb-service: &defradb-service
  image: sourcenetwork/defradb:1.0.0-rc1
  environment:
    DEFRA_KEYRING_SECRET: test-secret
  command:
    - start
    - --rootdir
    - /data
    - --url
    - 0.0.0.0:9181
    - --p2paddr
    - /ip4/0.0.0.0/tcp/9171
    - --development
  networks:
    - swarm

x-broker-service: &broker-service
  image: debian:bookworm-slim
  command: ["/usr/local/bin/leona_context_broker"]
  environment: &broker-env
    RUST_LOG: info
    BROKER_HOST: 0.0.0.0
    BROKER_PORT: 8080
    BROKER_DEFRADB_TIMEOUT_MS: 30000
    BROKER_OUTBOUND_TIMEOUT_MS: 5000
    BROKER_P2P_ENABLED: "true"
    BROKER_PEER_SYNC_TIMEOUT_MS: 120000
    BROKER_P2P_SEEDS: http://broker1:8080/ngsi-ld/v1,http://broker2:8080/ngsi-ld/v1,http://broker3:8080/ngsi-ld/v1,http://broker4:8080/ngsi-ld/v1,http://broker5:8080/ngsi-ld/v1,http://broker6:8080/ngsi-ld/v1,http://broker7:8080/ngsi-ld/v1,http://broker8:8080/ngsi-ld/v1,http://broker9:8080/ngsi-ld/v1,http://broker10:8080/ngsi-ld/v1
    BROKER_ENTITY_EVENT_WATCH_ENABLED: "true"
    BROKER_ENTITY_EVENT_WATCH_INTERVAL_MS: 100
    BROKER_ENTITY_WATCH_ENABLED: "true"
    BROKER_ENTITY_WATCH_INTERVAL_MS: 30000
  volumes:
    - ./target/debug/leona_context_broker:/usr/local/bin/leona_context_broker:ro
  networks:
    - swarm

services:
  sink:
    image: python:3.12-alpine
    command: ["python", "/app/notification_sink.py", "8080"]
    volumes:
      - ./tests/notification_sink.py:/app/notification_sink.py:ro
    ports:
      - "19080:8080"
    networks:
      - swarm

  defra1:
    <<: *defradb-service
    volumes:
      - defra1-data:/data

  defra2:
    <<: *defradb-service
    volumes:
      - defra2-data:/data

  defra3:
    <<: *defradb-service
    volumes:
      - defra3-data:/data

  defra4:
    <<: *defradb-service
    volumes:
      - defra4-data:/data

  defra5:
    <<: *defradb-service
    volumes:
      - defra5-data:/data

  defra6:
    <<: *defradb-service
    volumes:
      - defra6-data:/data

  defra7:
    <<: *defradb-service
    volumes:
      - defra7-data:/data

  defra8:
    <<: *defradb-service
    volumes:
      - defra8-data:/data

  defra9:
    <<: *defradb-service
    volumes:
      - defra9-data:/data

  defra10:
    <<: *defradb-service
    volumes:
      - defra10-data:/data

  broker1:
    <<: *broker-service
    depends_on:
      - sink
      - defra1
    environment:
      <<: *broker-env
      BROKER_ID: broker1
      BROKER_PUBLIC_ENDPOINT: http://broker1:8080/ngsi-ld/v1
      BROKER_DEFRADB_URL: http://defra1:9181/api/v0/graphql
    ports:
      - "18081:8080"

  broker2:
